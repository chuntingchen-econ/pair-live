<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair Live · Meetings</title>
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--ink:#20222a;--muted:#626b78;--line:#e3e5ea;--accent:#223149;--link:#1d4ed8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f121c;--card:#171b28;--ink:#e8eaf2;--muted:#a1a8bd;--line:#2c3245;--accent:#a9b8ff;--link:#9db4ff}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:26px;margin:0 0 18px;color:var(--accent)}
.mt{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0;text-decoration:none;color:inherit}
.mt:hover{border-color:var(--accent)}
.mt:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.date{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.what{font-weight:600;margin-top:4px}
.latest{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:#15803d;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:3px}
</style>
</head>
<body>
<main>
<h1>Pair Live · Meetings</h1>
<div id="list"></div>
</main>
<script>
// one line per meeting, newest first: [date (YYYYMMDD), title, slides link]
const MEETINGS=[
 ['20261125','Pair Live design: three experiments','https://claude.ai/artifact/A9zfG7fmXTHjfFDE3CmXd3'],
];
const fmt=d=>`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
document.getElementById('list').replaceChildren(...MEETINGS.map(([d,what,url],i)=>{
 const a=document.createElement('a');a.className='mt';a.href=url;
 a.innerHTML=`<div class="date"></div><div class="what"></div>`;
 a.querySelector('.date').textContent=fmt(d);if(i===0){const s=document.createElement('span');s.className='latest';s.textContent='latest';a.querySelector('.date').append(s)}
 a.querySelector('.what').textContent=what;return a}));
</script>
</body>
</html>
